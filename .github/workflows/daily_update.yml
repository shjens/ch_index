name: Update Swiss Index

on:
  schedule:
    # Runs at 22:00 UTC every day (After Swiss market close)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANT: Allows the bot to save the JSON file back to the repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history (sometimes needed for git operations)
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas yfinance

      - name: Run Index Script
        run: python main.py

      - name: Commit and Push JSON
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Force add the file in case it's new or ignored
          git add index_data.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update index data"
            git push
          fi
