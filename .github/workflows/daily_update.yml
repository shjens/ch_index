name: Update Swiss Index

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Updated to 3.11 to fix yfinance error

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance
          echo "Dependencies installed successfully."

      - name: Debug - List files before run
        run: ls -la

      - name: Run Index Script
        run: |
          echo "Starting Python script..."
          python main.py
          echo "Python script finished."

      - name: Debug - Check if JSON exists and show content
        run: |
          if [ -f index_data.json ]; then
            echo "File index_data.json exists."
            cat index_data.json
          else
            echo "ERROR: index_data.json was NOT created/found!"
            exit 1
          fi

      - name: Commit and Push JSON
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Force add the file
          git add index_data.json
          
          # Check status
          git status
          
          # Commit and Push
          timestamp=$(date -u)
          git commit -m "Update index data: ${timestamp}" || echo "No changes to commit"
          git push
